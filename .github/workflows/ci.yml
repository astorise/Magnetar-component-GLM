name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  module:
    uses: astorise/Magnetar/.github/workflows/submodule-ci.yml@main
    with:
      module-path: components/glm
      deny: false
  router-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Test GLM grouped router semantics
        run: cargo +1.100.0 test --locked --test router_integration --test pytorch_router_integration
